name: Docker

on:
    workflow_call:
        inputs:
            version:
                description: Semver without leading v (e.g. 0.1.12)
                required: true
                type: string
    workflow_dispatch:
        inputs:
            version:
                description: Semver without leading v (e.g. 0.1.12)
                required: true
                type: string

concurrency:
    group: docker-${{ inputs.version }}
    cancel-in-progress: true

env:
    IMAGE_NAME: janus-identicon-api

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Validate version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
                    echo "::error::Invalid version '$VERSION' (expected semver without leading v, e.g. 0.1.12)"
                    exit 1
                  fi

            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest
                      type=raw,value=${{ inputs.version }}
                      type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
                      type=semver,pattern={{major}},value=v${{ inputs.version }}
                      type=sha,prefix=

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: crates/identicon-api/Containerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
