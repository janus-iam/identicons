name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Semver without leading v (e.g. 0.1.12)
                required: true
                type: string
            create_github_release:
                description: Create a GitHub Release for v{version} after publish succeeds
                type: boolean
                default: true
    push:
        tags: ["v*"]

permissions:
    contents: write
    id-token: write

concurrency:
    group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    cancel-in-progress: false

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.resolve.outputs.version }}
            tag: ${{ steps.resolve.outputs.tag }}
        steps:
            - name: Resolve version
              id: resolve
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  INPUT_VERSION: ${{ inputs.version }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    VERSION="$INPUT_VERSION"
                  else
                    VERSION="${REF_NAME#v}"
                  fi
                  if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
                    echo "::error::Invalid version '$VERSION' (expected semver without leading v, e.g. 0.1.12)"
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Releasing $VERSION (tag v$VERSION)"

    tag:
        needs: version
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Create and push tag if missing
              env:
                  TAG: ${{ needs.version.outputs.tag }}
              run: |
                  if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
                    echo "Tag ${TAG} already exists — reusing it for this release."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "${TAG}" -m "Release ${TAG}"
                  git push origin "refs/tags/${TAG}"
                  echo "Created and pushed ${TAG}"

    wasm:
        needs: [version, tag]
        if: >-
            always()
            && needs.version.result == 'success'
            && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/wasm-package.yml
        with:
            version: ${{ needs.version.outputs.version }}

    docker:
        needs: [version, tag]
        if: >-
            always()
            && needs.version.result == 'success'
            && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
        permissions:
            contents: read
        uses: ./.github/workflows/docker.yml
        with:
            version: ${{ needs.version.outputs.version }}
        secrets: inherit

    github-release:
        needs: [version, tag, wasm, docker]
        if: >-
            github.event_name == 'workflow_dispatch'
            && inputs.create_github_release
            && needs.wasm.result == 'success'
            && needs.docker.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ needs.version.outputs.tag }}
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "GitHub Release ${TAG} already exists — leaving it unchanged."
                    exit 0
                  fi
                  gh release create "$TAG" \
                    --title "$TAG" \
                    --notes "Release ${VERSION}: npm \`@janus-iam/identicon-wasm@${VERSION}\` and Docker image tags \`${VERSION}\` / \`latest\`."
