name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Semver without leading v (e.g. 0.1.12)
                required: true
                type: string
            create_github_release:
                description: Create a GitHub Release named v{version} after publish succeeds
                type: boolean
                default: true

permissions:
    contents: write
    id-token: write

concurrency:
    group: release-${{ inputs.version }}
    cancel-in-progress: false

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.resolve.outputs.version }}
        steps:
            - name: Resolve version
              id: resolve
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
                    echo "::error::Invalid version '$VERSION' (expected semver without leading v, e.g. 0.1.12)"
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Releasing $VERSION"

    wasm:
        needs: version
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/wasm-package.yml
        with:
            version: ${{ needs.version.outputs.version }}

    docker:
        needs: version
        permissions:
            contents: read
        uses: ./.github/workflows/docker.yml
        with:
            version: ${{ needs.version.outputs.version }}
        secrets: inherit

    github-release:
        needs: [version, wasm, docker]
        if: >-
            inputs.create_github_release
            && needs.wasm.result == 'success'
            && needs.docker.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  TITLE="v${VERSION}"
                  if gh release view "$TITLE" >/dev/null 2>&1; then
                    echo "GitHub Release ${TITLE} already exists — leaving it unchanged."
                    exit 0
                  fi
                  gh release create "$TITLE" \
                    --target "${{ github.sha }}" \
                    --title "$TITLE" \
                    --notes "Release ${VERSION}: npm \`@janus-iam/identicon-wasm@${VERSION}\` and Docker image tags \`${VERSION}\` / \`latest\`."
