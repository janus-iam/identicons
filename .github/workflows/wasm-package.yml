name: WASM package

on:
    workflow_call:
        inputs:
            version:
                description: Semver without leading v (e.g. 0.1.12)
                required: true
                type: string
    workflow_dispatch:
        inputs:
            version:
                description: Semver without leading v (e.g. 0.1.12)
                required: true
                type: string

permissions:
    contents: read
    id-token: write

concurrency:
    group: wasm-package-${{ inputs.version }}
    cancel-in-progress: true

env:
    WASM_PKG_DIR: crates/identicon-wasm/pkg

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - uses: Swatinem/rust-cache@v2

            - name: Install wasm-pack
              uses: taiki-e/install-action@wasm-pack

            - name: Build package with wasm-pack
              run: wasm-pack build crates/identicon-wasm --target bundler --release --scope janus-iam

            - name: Verify generated package.json
              run: test -f "${{ env.WASM_PKG_DIR }}/package.json"

            - name: Upload package artifact
              uses: actions/upload-artifact@v7
              with:
                  name: identicon-wasm-pkg
                  path: ${{ env.WASM_PKG_DIR }}
                  if-no-files-found: error

    publish:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download package artifact
              uses: actions/download-artifact@v8
              with:
                  name: identicon-wasm-pkg
                  path: ${{ env.WASM_PKG_DIR }}

            - uses: oven-sh/setup-bun@v2

            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*

            - name: Validate and set package version
              working-directory: ${{ env.WASM_PKG_DIR }}
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
                    echo "::error::Invalid version '$VERSION' (expected semver without leading v, e.g. 0.1.12)"
                    exit 1
                  fi
                  bun pm pkg set "version=${VERSION}"
                  echo "Publishing @janus-iam/identicon-wasm@${VERSION}"

            - name: Publish to npm registry
              working-directory: ${{ env.WASM_PKG_DIR }}
              run: npm publish --provenance --verbose
